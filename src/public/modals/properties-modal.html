  <!-- Dosya / Seçim Özellikleri & Toplam Boyut Modalı -->
  <dialog id="properties-dialog" class="modal-dialog properties-dialog" closedby="any" aria-labelledby="props-title">
    <div class="props-head">
      <div class="props-head-title">
        <span id="props-icon" class="props-icon">ℹ️</span>
        <div>
          <strong id="props-title">Özellikler</strong>
          <div id="props-subtitle" class="muted-text"></div>
        </div>
      </div>
      <button type="button" id="btn-props-close" class="icon-btn">✕</button>
    </div>
    <div id="props-body" class="props-body"></div>
    <div class="props-footer">
      <div class="props-footer-left">
        <button type="button" id="btn-props-copy-path" class="cmd-btn">🔗 Yolu Kopyala</button>
        <button type="button" id="btn-props-reveal" class="cmd-btn">📂 Bulunduğu Yeri Aç</button>
      </div>
      <button type="button" id="btn-props-ok" class="cmd-btn primary">Tamam</button>
    </div>
  </dialog>
