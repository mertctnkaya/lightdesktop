  <!-- Genel İşlem / Toplu Yeniden Adlandırma Modalı -->
  <dialog id="prompt-dialog" class="modal-dialog prompt-dialog" closedby="any" aria-labelledby="prompt-title">
    <form method="dialog" id="prompt-form">
      <h3 id="prompt-title">İşlem</h3>
      <p id="prompt-desc" class="muted-text"></p>
      <div id="prompt-fields"></div>
      <div class="prompt-buttons">
        <button type="button" id="btn-prompt-cancel" class="cmd-btn">İptal</button>
        <button type="submit" id="btn-prompt-ok" class="cmd-btn primary">Onayla</button>
      </div>
    </form>
  </dialog>
